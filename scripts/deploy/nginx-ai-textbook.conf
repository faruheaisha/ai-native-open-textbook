# AI 原生开放教材 · 静态站点
# 站点根目录由 scripts/deploy/deploy.sh 通过 rsync 更新，勿手工改动其内容。
#
# 反向代理关系（同一台机器上已有的服务，别混）：
#   faruheaisha.me / www.faruheaisha.me  -> /opt/imagetools/web/dist （imagetools SPA）
#   yixin-yanjin-health.faruheaisha.me   -> 127.0.0.1:3000
#   iopaint.faruheaisha.me               -> 127.0.0.1:5000

server {
    listen 80;
    listen [::]:80;
    server_name book.faruheaisha.me;

    root /var/www/ai-native-textbook;
    index index.html;

    charset utf-8;

    # 教材是整站静态产物，链接不带 .html（VitePress cleanUrls）。
    # 所以必须按 $uri -> $uri.html -> $uri/ 的顺序找，否则每个内页都会 404。
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 第三方图片本地镜像。文件名带内容哈希，永远不会变，可以放心长缓存。
    location /mirror/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Vite 产物：文件名同样带哈希。
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 这本教材的正文页会长期不变，但页面本身没有哈希，
    # 交给浏览器短期缓存即可，避免更新后读者一直看到旧页面。
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/rss+xml;

    # 2GB 内存的小机器：把静态文件读取交给内核页缓存，别让 nginx 自己反复啃磁盘。
    sendfile on;
    tcp_nopush on;
    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # 整站约 2.2 万条内链，索引文件不小，给足客户端上限无妨。
    client_max_body_size 8m;

    error_page 404 /404.html;
}