# AI 原生开放教材 · 静态站点
# 站点根目录由 scripts/deploy/deploy.sh 通过 rsync 更新，勿手工改动其内容。
#
# 证书由 certbot 的 webroot 方式签发，不走 --nginx 插件改写本文件，
# 这样这份配置始终是唯一真源。续期命令：
#   certbot renew --dry-run
#
# 同一台机器上已有的反向代理，别混：
#   faruheaisha.me / www.faruheaisha.me  -> /opt/imagetools/web/dist （imagetools SPA）
#   yixin-yanjin-health.faruheaisha.me   -> 127.0.0.1:3000
#   iopaint.faruheaisha.me               -> 127.0.0.1:5000

server {
    listen 80;
    listen [::]:80;
    server_name aibook.faruheaisha.me;

    # certbot 续期要走 webroot 校验，这个路径必须能在 80 端口访问到。
    # 放在最前面，避免被下面的 301 吃掉。
    location /.well-known/acme-challenge/ {
        root /var/www/ai-native-textbook;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aibook.faruheaisha.me;

    ssl_certificate     /etc/letsencrypt/live/aibook.faruheaisha.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aibook.faruheaisha.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 只锁本机，不加 includeSubDomains：万一这张证书出问题，
    # 也只影响这一个子域，不会牵连同一台机器上的其它站点。
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/ai-native-textbook;
    index index.html;

    charset utf-8;

    # 整站是静态产物，链接不带 .html（VitePress cleanUrls）。
    # 必须按 $uri -> $uri.html -> $uri/ 的顺序找，否则每个内页都会 404。
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 第三方图片本地镜像。文件名带内容哈希，永远不会变，可以放心长缓存。
    location /mirror/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Vite 产物：文件名同样带哈希。
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 正文页长期不变，但页面地址本身没有哈希，
    # 交给浏览器短期缓存即可，避免更新后读者一直看到旧页面。
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/rss+xml;

    # 2GB 内存的小机器：静态文件读取交给内核页缓存，别让 nginx 自己反复啃磁盘。
    sendfile on;
    tcp_nopush on;
    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    error_page 404 /404.html;
}